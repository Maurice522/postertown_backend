# Render's free plan puts the API to sleep after 15 minutes without requests, and the
# next visitor waits ~25 seconds for it to wake up. Pinging it every 10 minutes keeps
# it awake (one always-on service fits in Render's 750 free hours a month).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl --silent --show-error --max-time 90 --retry 2 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://postertown-backend-v2.onrender.com/
