# Backup for keep-warm/ (the Cloudflare cron worker, which pings every 5 minutes on time).
# Render's free plan puts the API to sleep after 15 minutes without requests; GitHub's
# schedule often runs late, so this alone isn't enough to keep it awake.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl --silent --show-error --max-time 90 --retry 2 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://postertown-backend-v2.onrender.com/
